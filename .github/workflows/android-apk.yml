name: Tenis Koçu APK

on:
  push:
    branches:
      - ccr-395ec174-km1p0u
      - main
    paths:
      - 'tenis-kocu/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android araçlarını kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-platform-23 aapt dalvik-exchange apksigner zipalign openjdk-17-jdk-headless

      - name: APK derle
        run: ./tenis-kocu/build.sh

      - name: APK'yı yükle (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TenisKocu-apk
          path: tenis-kocu/build/TenisKocu.apk

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tenis-kocu-latest
          target_commitish: ${{ github.sha }}
          name: Tenis Koçu (son sürüm)
          make_latest: true
          files: tenis-kocu/build/TenisKocu.apk
          body: |
            Tenis Koçu Android uygulamasının son sürümü.
            Telefonundan **TenisKocu.apk** dosyasını indir, aç ve "Bilinmeyen kaynaklardan yükleme" iznini vererek kur.
            Commit: ${{ github.sha }}
